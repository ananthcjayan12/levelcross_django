version: '3.8'

services:
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - ./data/levelcross_django/csv:/app/data/csv  # For uploaded CSV files
      - ./data/levelcross_django/db:/app/data/db  # For SQLite database
    ports:
      - "8021:8000"
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=core.settings
      - ALLOWED_HOSTS=localhost,127.0.0.1
    restart: always

volumes:
  static_volume:

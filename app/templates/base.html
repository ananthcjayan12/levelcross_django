{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezhupunna Levelcross</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-indigo-600 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo/Title Section -->
                <div class="flex-shrink-0">
                    <span class="text-white text-xl font-bold">Ezhupunna</span>
                    <span class="text-white text-xl font-bold block sm:inline">Levelcross</span>
                </div>
                
                <!-- Navigation Links -->
                <div class="hidden sm:block">
                    <div class="ml-10 flex items-baseline space-x-4">
                        <a href="{% url 'home' %}" 
                           class="{% if request.path == '/' %}bg-indigo-700{% endif %} text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition-colors">
                            Dashboard
                        </a>
                        <a href="{% url 'upload_csv' %}" 
                           class="{% if request.path == '/upload/' %}bg-indigo-700{% endif %} text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition-colors">
                            Upload
                        </a>
                    </div>
                </div>

                <!-- Mobile menu button -->
                <div class="sm:hidden">
                    <button type="button" 
                            onclick="toggleMobileMenu()"
                            class="text-white hover:bg-indigo-700 p-2 rounded-md">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mobile menu -->
            <div class="sm:hidden hidden" id="mobile-menu">
                <div class="px-2 pt-2 pb-3 space-y-1">
                    <a href="{% url 'home' %}" 
                       class="{% if request.path == '/' %}bg-indigo-700{% endif %} text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-indigo-700">
                        Dashboard
                    </a>
                    <a href="{% url 'upload_csv' %}" 
                       class="{% if request.path == '/upload/' %}bg-indigo-700{% endif %} text-white block px-3 py-2 rounded-md text-base font-medium hover:bg-indigo-700">
                        Upload
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Messages -->
    {% if messages %}
    <div class="fixed top-16 right-4 z-50">
        {% for message in messages %}
        <div class="animate-fade-in-down bg-white rounded-lg shadow-lg mt-4 p-4 {% if message.tags == 'success' %}text-green-700 border-l-4 border-green-500{% elif message.tags == 'error' %}text-red-700 border-l-4 border-red-500{% else %}text-yellow-700 border-l-4 border-yellow-500{% endif %}">
            <p class="text-sm font-medium">{{ message }}</p>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Image -->
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <img src="{{ AD_IMAGE_URL }}" 
             alt="Smile Craft Dental Clinic" 
             class="w-full rounded-lg shadow-lg"
             onerror="this.style.display='none';">
    </div>

    {% block extra_js %}{% endblock %}

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>

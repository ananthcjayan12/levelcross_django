{% extends 'base.html' %}

{% block content %}
<div class="py-8">
  <div class="max-w-4xl mx-auto px-4">
    <h2 class="text-3xl font-bold text-gray-900 mb-6 text-center">Next Available Boats</h2>
    {% if next_boats %}
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        {% for boat in next_boats %}
        <div class="bg-white border border-gray-200 rounded-lg shadow hover:shadow-lg transition p-6 flex flex-col items-center">
          <svg class="w-12 h-12 text-indigo-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 13l4 4 8-8" />
          </svg>
          <span class="text-2xl font-semibold text-gray-900 mb-2">{{ boat.time|time:"h:i A" }}</span>
          <span class="text-sm text-gray-500 uppercase tracking-wide">{{ boat.station }}</span>
        </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="text-center py-12">
        <p class="text-gray-500 text-lg">No more boats scheduled for today.</p>
      </div>
    {% endif %}
    <div class="mt-8 text-center">
      <a href="{% url 'boat_timetable' %}" class="inline-block px-6 py-3 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 transition">View Full Timetable</a>
    </div>
  </div>
</div>
{% endblock %}

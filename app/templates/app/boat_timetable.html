{% extends 'base.html' %}

{% block content %}
<div class="bg-white rounded-lg shadow-sm p-6">
    <h2 class="text-xl font-bold mb-4">Boat Timetable</h2>
    {% if timings %}
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Station</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        {% for boat in timings %}
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-gray-700">{{ boat.station }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-gray-700">{{ boat.time|time:"H:i" }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
        <p class="text-gray-500">No boat timings found.</p>
    {% endif %}
    <a href="{% url 'boat_upload' %}" class="text-indigo-600 hover:underline mt-4 inline-block">Upload new timings &rarr;</a>
</div>
{% endblock %}

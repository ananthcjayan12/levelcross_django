{% if trains %}
    <div class="space-y-3">
        {% for train in trains %}
        <div class="bg-gray-50/50 rounded-lg p-4 hover:bg-gray-50 transition-all hover-shadow">
            <div class="flex justify-between items-center">
                <div class="space-y-1">
                    <div class="flex items-center space-x-3">
                        <button onclick="copyTrainNumber('{{ train.train_number }}')" 
                                class="text-lg font-semibold text-gray-900 hover:text-indigo-600 transition-colors flex items-center space-x-2">
                            <span>{{ train.train_number }}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>
                            </svg>
                        </button>
                        <span class="px-2 py-1 text-xs font-medium rounded-full 
                            {% if train.station == 'ERS' %}bg-blue-100 text-blue-700
                            {% else %}bg-purple-100 text-purple-700{% endif %}">
                            {{ train.station }}
                        </span>
                    </div>
                    <p class="text-sm text-gray-600">{{ train.week_day }}</p>
                </div>
                <div class="text-right">
                    <div class="text-xl font-bold text-gray-900">{{ train.time|time:"H:i" }}</div>
                    <div class="text-sm text-gray-500">Expected</div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% else %}
    <div class="bg-gray-50/50 rounded-lg p-6">
        <div class="text-center text-gray-500">
            <svg class="w-8 h-8 mx-auto mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-sm text-gray-400">No trains available</p>
        </div>
    </div>
{% endif %}
